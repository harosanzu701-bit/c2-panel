<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Command Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #0b0202;
            color: #ff3333;
            padding: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff3333;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .status {
            font-size: 11px;
            border: 1px solid #ff3333;
            padding: 3px 6px;
            background: #200000;
        }
        .section {
            border: 1px solid #ff3333;
            margin-bottom: 15px;
            background: #110000;
        }
        .section-header {
            background: #260000;
            padding: 5px 10px;
            font-size: 12px;
            border-bottom: 1px solid #ff3333;
            letter-spacing: 1px;
        }
        .section-body {
            padding: 10px;
        }
        .btn {
            width: 100%;
            background: #1a0000;
            color: #ff3333;
            border: 1px solid #ff3333;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .btn:active {
            background: #ff3333;
            color: #0b0202;
        }
        .logs {
            background: #050101;
            border: 1px solid #ff3333;
            height: 180px;
            padding: 8px;
            overflow-y: auto;
            font-size: 11px;
            color: #33ff33;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">root@dashboard:~#</div>
        <div class="status">ONLINE [SECURE]</div>
    </div>

    <div class="section">
        <div class="section-header">// QUICK CONTROLS</div>
        <div class="section-body">
            <button class="btn" onclick="sendPing()">PING STATUS</button>
            <button class="btn" onclick="sendAlert()">SEND TEST ALERT TO TG</button>
        </div>
    </div>

    <div class="section">
        <div class="section-header">// INCOMING FEED</div>
        <div class="section-body">
            <div class="btn" style="color: #888; border-color: #550000; cursor: default;">Ready for payload signals...</div>
            <button class="btn" onclick="clearLogs()" style="border-color: #550000; color: #aa4444;">CLEAR LOGS</button>
        </div>
    </div>

    <div class="section">
        <div class="section-header">// SYSTEM LOGS</div>
        <div class="section-body">
            <div id="log-box" class="logs">[+] Initializing secure static interface...
[+] Dashboard loaded successfully.
[+] Telegram Bridge Configured (oreo_panel_bot).
[+] Waiting for remote node signals...</div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "9206667599:AAFYi776o_0naIT3c6y2fDUDcFy4EapVi2U";
        const CHAT_ID = "6878595284";

        function logMessage(text) {
            const box = document.getElementById('log-box');
            box.innerText += "\n" + text;
            box.scrollTop = box.scrollHeight;
        }

        function sendPing() {
            logMessage("[*] Pinging local node interface...");
            setTimeout(() => {
                logMessage("[+] Node status: ACTIVE (100% Operational)");
            }, 500);
        }

        async function sendAlert() {
            logMessage("[*] Transmitting signal to Telegram Bot...");
            const message = "🚨 Alert from C2 Dashboard: Test signal triggered successfully from mobile panel!";
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`;

            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data.ok) {
                    logMessage("[+] Signal successfully delivered to Telegram!");
                } else {
                    logMessage("[-] Error: Failed to send telegram message.");
                }
            } catch (e) {
                logMessage("[-] Network Error: Check internet connection.");
            }
        }

        function clearLogs() {
            document.getElementById('log-box.innerText') = "";
            document.getElementById('log-box').innerText = "[+] Logs cleared.";
        }
    </script>
</body>
</html>
