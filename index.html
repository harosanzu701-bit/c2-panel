<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER COMMAND // DASHBOARD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #080202;
            color: #ff3333;
            padding: 15px;
        }
        header {
            border-bottom: 2px solid #ff0000;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #ff4d4d;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }
        .status-badge {
            background: #200;
            border: 1px solid #ff0000;
            padding: 4px 8px;
            font-size: 0.75rem;
            color: #ff6666;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background: #120404;
            border: 1px solid #4a0000;
            padding: 15px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.05);
        }
        .card h2 {
            font-size: 0.95rem;
            color: #ff8080;
            margin-bottom: 10px;
            border-bottom: 1px dashed #4a0000;
            padding-bottom: 5px;
        }
        .console {
            background: #030000;
            border: 1px solid #300;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #00ff66;
            line-height: 1.4;
        }
        .btn {
            background: #2a0000;
            color: #ff3333;
            border: 1px solid #ff0000;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn:active {
            background: #ff0000;
            color: #000;
        }
        input[type="text"] {
            width: 100%;
            background: #030000;
            border: 1px solid #500;
            padding: 8px;
            color: #ff3333;
            margin-top: 5px;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <header>
        <h1>root@dashboard:~#</h1>
        <div class="status-badge">ONLINE [SECURE]</div>
    </header>

    <div class="grid">
        <!-- System Control Card -->
        <div class="card">
            <h2>// QUICK CONTROLS</h2>
            <button class="btn" onclick="triggerAlert()">PING STATUS</button>
        </div>

        <!-- Target / Data Receiver Card -->
        <div class="card">
            <h2>// INCOMING FEED</h2>
            <input type="text" id="targetInput" placeholder="Webhook / Target Node..." value="Ready for payload signals...">
            <button class="btn" onclick="clearConsole()">CLEAR LOGS</button>
        </div>

        <!-- Terminal Logs Card -->
        <div class="card">
            <h2>// SYSTEM LOGS</h2>
            <div class="console" id="consoleBox">
                [+] Initializing secure static interface...<br>
                [+] Dashboard loaded successfully.<br>
                [+] Waiting for remote node signals...<br>
            </div>
        </div>
    </div>

    <script>
        function triggerAlert() {
            const consoleBox = document.getElementById('consoleBox');
            const time = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `[${time}] System pinged successfully. All nodes operational.<br>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('consoleBoxinnerHTML = "[+] Logs cleared.<br>";
        }
    </script>
</body>
</html>
